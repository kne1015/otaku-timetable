<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오타쿠대학교 수강시간표 🌿</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2canvas for Screenshot Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    
    /* Strict Table Layout for Pixel-Perfect Alignment */
    .timetable-table {
      table-layout: fixed;
      border-collapse: collapse;
      width: 100%;
    }
    .timetable-table th, .timetable-table td {
      border: 1px solid #c7f5e8;
      text-align: center;
      vertical-align: middle;
      padding: 0;
    }
    .timetable-table th {
      height: 38px;
      background-color: #e6fcf5;
      color: #0c8563;
      font-weight: 700;
    }
    .timetable-table td.time-col {
      width: 48px;
      height: 44px;
      font-size: 0.72rem;
      color: #0ca678;
      font-weight: 600;
      background-color: #f4fbf7;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #6ee7b7; border-radius: 3px; }
  </style>
</head>
<body class="bg-teal-50/40 min-h-screen text-slate-800 p-2 sm:p-6 flex flex-col items-center">

  <!-- Main Container Optimized for Tablet Screen -->
  <div class="w-full max-w-md sm:max-w-xl bg-white rounded-2xl shadow-xl border border-teal-100 overflow-hidden flex flex-col">
    
    <!-- Top Header & Global Actions -->
    <div class="p-4 bg-gradient-to-r from-teal-50 via-emerald-50 to-teal-50 border-b border-teal-100 space-y-3">
      <div class="flex items-center justify-between">
        <h1 class="text-base sm:text-lg font-bold text-teal-800 flex items-center gap-2">
          <span class="text-xl">🌿</span> 오타쿠대학교 시간표 메이커
        </h1>
        <button onclick="exportImage()" class="px-3 py-1.5 bg-teal-500 hover:bg-teal-600 text-white text-xs font-bold rounded-lg shadow transition-all active:scale-95 flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-camera"></i> <span>캡처 저장</span>
        </button>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex gap-2">
        <button onclick="addRandomCourses()" class="flex-1 py-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs font-bold rounded-xl border border-emerald-300 shadow-xs transition active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-dice"></i> <span>🎲 겹치지 않는 랜덤 3과목 완성</span>
        </button>
        <button onclick="clearSchedule()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold rounded-xl border border-rose-200 transition active:scale-95 cursor-pointer" title="시간표 초기화">
          초기화
        </button>
      </div>
    </div>

    <!-- Course Catalog Section -->
    <div class="p-3 sm:p-4 border-b border-slate-100 bg-white space-y-2">
      <div class="text-xs font-bold text-slate-600 flex items-center justify-between">
        <span class="flex items-center gap-1"><i class="fa-solid fa-building-columns text-teal-600"></i> 단과대별 개설 과목</span>
        <span id="course-count-badge" class="text-[10px] bg-teal-100 text-teal-800 font-semibold px-2 py-0.5 rounded-full">전체</span>
      </div>

      <!-- Faculty Filter Tabs -->
      <div class="flex gap-1 overflow-x-auto pb-1 text-xs border-b border-slate-100">
        <button onclick="filterFaculty('전체')" class="tab-btn active shrink-0 px-2.5 py-1 rounded-lg font-semibold bg-teal-500 text-white transition cursor-pointer">전체</button>
        <button onclick="filterFaculty('음성합성엔진대학')" class="tab-btn shrink-0 px-2.5 py-1 rounded-lg font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition cursor-pointer">음성합성엔진대학</button>
        <button onclick="filterFaculty('애니메이션대학')" class="tab-btn shrink-0 px-2.5 py-1 rounded-lg font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition cursor-pointer">애니메이션대학</button>
      </div>

      <!-- Course Cards Container -->
      <div id="course-list" class="space-y-2 max-h-52 overflow-y-auto pr-1">
        <!-- Dynamically rendered -->
      </div>
    </div>

    <!-- Enrolled Badges Bar -->
    <div class="px-4 py-2 bg-slate-50/80 border-b border-slate-100 flex items-center justify-between text-xs">
      <span class="font-bold text-slate-600 flex items-center gap-1.5 shrink-0">
        <i class="fa-solid fa-clipboard-check text-teal-600"></i> 신청 목록 (<span id="enrolled-count" class="text-teal-600 font-extrabold">0</span>개)
      </span>
      <div id="enrolled-badges" class="flex gap-1 overflow-x-auto max-w-[260px] py-0.5">
        <!-- Badge chips appended here -->
      </div>
    </div>

    <!-- TIMETABLE CANVAS (SCREENSHOT TARGET) -->
    <div id="timetable-area" class="p-4 bg-white relative">
      <div class="border-2 border-teal-300 rounded-2xl p-3 bg-gradient-to-b from-teal-50/40 via-white to-teal-50/20 shadow-inner">
        
        <!-- Header Profile Info -->
        <div class="flex items-center justify-between mb-2.5 pb-2 border-b border-teal-200/80">
          <div>
            <div class="text-xs sm:text-sm font-extrabold text-teal-800 tracking-tight flex items-center gap-1">
              <span>🌿</span> 오타쿠대학교 수강시간표
            </div>
            <div class="text-[8px] sm:text-[9px] text-teal-500 tracking-wider">OTAKU UNIVERSITY ACADEMIC TIMETABLE</div>
          </div>
          <div class="text-right">
            <div class="text-[10px] font-bold text-teal-900">학과: <span class="font-normal text-teal-700">보컬로이드학과</span></div>
            <div class="text-[10px] font-bold text-teal-900">학생: <span class="font-normal text-teal-700">라보멤</span></div>
          </div>
        </div>

        <!-- Timetable Table Grid -->
        <table class="timetable-table text-xs rounded-xl overflow-hidden bg-white shadow-xs">
          <thead>
            <tr class="text-teal-800 font-bold text-[11px]">
              <th class="w-12">시간</th>
              <th>월</th>
              <th>화</th>
              <th>수</th>
              <th>목</th>
              <th>금</th>
            </tr>
          </thead>
          <tbody id="timetable-body">
            <!-- Dynamically generated rows with rowspan -->
          </tbody>
        </table>

        <!-- Watermark Footer inside canvas -->
        <div class="mt-2.5 pt-1.5 border-t border-teal-100 flex justify-between items-center text-[9px] text-teal-500 font-medium">
          <span>otaku.univ / 2026-2학기</span>
          <span>✨ 나만의 최애 수강시간표 ✨</span>
        </div>

      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 bg-slate-800/90 backdrop-blur text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 transform translate-y-2 z-50 flex items-center gap-2">
    <i class="fa-solid fa-circle-info text-teal-300"></i> <span id="toast-text">알림 메세지</span>
  </div>

  <script>
    // Strict Official Course Data
    const officialCourses = [
      {
        id: 'vocaloid_history',
        faculty: '음성합성엔진대학',
        name: '보컬로이드역사학개론',
        professor: '라보멤',
        color: '#d3f9d8', // Soft Mint
        textColor: '#2b8a3e',
        displayTime: '화 13:00~14:00, 목 10:00~12:00',
        slots: [
          { day: '화', start: 13, end: 14 },
          { day: '목', start: 10, end: 12 }
        ]
      },
      {
        id: 'mmd_archaeology',
        faculty: '음성합성엔진대학',
        name: 'MMD 고고학',
        professor: '라보멤',
        color: '#e7f5ff', // Soft Sky Blue
        textColor: '#1971c2',
        displayTime: '수 13:00~16:00',
        slots: [
          { day: '수', start: 13, end: 16 }
        ]
      },
      {
        id: 'vocaloid_song',
        faculty: '음성합성엔진대학',
        name: '보컬로이드 노래의 이해',
        professor: '라보멤',
        color: '#fff3bf', // Soft Yellow
        textColor: '#f08c00',
        displayTime: '수 11:00~13:00',
        slots: [
          { day: '수', start: 11, end: 13 }
        ]
      },
      {
        id: 'timemachine_practice',
        faculty: '애니메이션대학',
        name: '타임머신 제작 실습1',
        professor: '라보멤',
        color: '#eebefa', // Soft Lavender
        textColor: '#9c36b5',
        displayTime: '금 12:00~16:00',
        slots: [
          { day: '금', start: 12, end: 16 }
        ]
      }
    ];

    const days = ['월', '화', '수', '목', '금'];
    const startHour = 9;
    const endHour = 17; // Displays 09:00 - 17:00 grid

    let enrolledCourses = [];
    let currentFaculty = '전체';

    window.onload = () => {
      renderCatalog();
      renderTimetableGrid();
    };

    function filterFaculty(faculty) {
      currentFaculty = faculty;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if(btn.innerText === faculty) {
          btn.className = 'tab-btn active shrink-0 px-2.5 py-1 rounded-lg font-semibold bg-teal-500 text-white transition cursor-pointer';
        } else {
          btn.className = 'tab-btn shrink-0 px-2.5 py-1 rounded-lg font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition cursor-pointer';
        }
      });
      document.getElementById('course-count-badge').innerText = faculty;
      renderCatalog();
    }

    function renderCatalog() {
      const container = document.getElementById('course-list');
      container.innerHTML = '';

      const filtered = officialCourses.filter(c => currentFaculty === '전체' || c.faculty === currentFaculty);

      filtered.forEach(course => {
        const isEnrolled = enrolledCourses.some(e => e.id === course.id);

        const card = document.createElement('div');
        card.className = `p-2.5 rounded-xl border transition-all flex items-center justify-between ${
          isEnrolled ? 'bg-teal-50/80 border-teal-300' : 'bg-slate-50/60 border-slate-200 hover:border-teal-300'
        }`;

        card.innerHTML = `
          <div class="pr-2">
            <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
              <span>${course.name}</span>
              <span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-200 text-slate-600 font-medium">${course.faculty.replace('대학','')}</span>
            </div>
            <div class="text-[10px] text-slate-500 mt-0.5">${course.professor} · ${course.displayTime}</div>
          </div>
          <button onclick="toggleEnroll('${course.id}')" class="px-3 py-1 text-xs font-bold rounded-lg transition-all shrink-0 cursor-pointer ${
            isEnrolled ? 'bg-rose-100 text-rose-600 hover:bg-rose-200' : 'bg-teal-500 text-white hover:bg-teal-600 shadow-xs active:scale-95'
          }">
            ${isEnrolled ? '취소' : '신청'}
          </button>
        `;
        container.appendChild(card);
      });
    }

    function toggleEnroll(courseId) {
      const course = officialCourses.find(c => c.id === courseId);
      if (!course) return;

      const index = enrolledCourses.findIndex(e => e.id === courseId);

      if (index > -1) {
        enrolledCourses.splice(index, 1);
        showToast(`'${course.name}' 과목을 취소했습니다.`);
      } else {
        if (hasCollision(course)) {
          showToast('⚠️ 기존 시간표와 겹치는 시간이 있습니다!');
          return;
        }
        enrolledCourses.push(course);
        showToast(`✨ '${course.name}' 수강신청 완료!`);
      }

      renderCatalog();
      renderTimetableGrid();
      renderEnrolledBadges();
    }

    function hasCollision(newCourse) {
      for (let enrolled of enrolledCourses) {
        for (let newSlot of newCourse.slots) {
          for (let enrolledSlot of enrolled.slots) {
            if (newSlot.day === enrolledSlot.day) {
              if (Math.max(newSlot.start, enrolledSlot.start) < Math.min(newSlot.end, enrolledSlot.end)) {
                return true;
              }
            }
          }
        }
      }
      return false;
    }

    // Precise HTML table Rowspan rendering matrix algorithm
    function renderTimetableGrid() {
      const tbody = document.getElementById('timetable-body');
      tbody.innerHTML = '';

      const totalHours = endHour - startHour;
      const matrix = Array.from({ length: totalHours }, () => Array(5).fill(null));

      // Map course slots onto matrix
      enrolledCourses.forEach(course => {
        course.slots.forEach(slot => {
          const dayIdx = days.indexOf(slot.day);
          if (dayIdx === -1) return;

          const startOffset = slot.start - startHour;
          const duration = slot.end - slot.start;

          matrix[startOffset][dayIdx] = {
            type: 'start',
            rowspan: duration,
            course: course
          };

          for (let i = 1; i < duration; i++) {
            if (startOffset + i < totalHours) {
              matrix[startOffset + i][dayIdx] = { type: 'spanned' };
            }
          }
        });
      });

      // Render table structure
      for (let h = 0; h < totalHours; h++) {
        const currentHour = startHour + h;
        const tr = document.createElement('tr');

        // Time label column
        const timeTd = document.createElement('td');
        timeTd.className = 'time-col';
        timeTd.innerText = `${currentHour}:00`;
        tr.appendChild(timeTd);

        // Day columns
        for (let d = 0; d < 5; d++) {
          const cellState = matrix[h][d];

          if (cellState && cellState.type === 'spanned') {
            continue; // Skip rendering cell due to rowspan above
          }

          const td = document.createElement('td');
          td.className = 'relative p-0.5 transition-all';

          if (cellState && cellState.type === 'start') {
            td.rowSpan = cellState.rowspan;
            const course = cellState.course;

            td.innerHTML = `
              <div class="w-full h-full rounded-lg p-1 text-center flex flex-col items-center justify-center relative shadow-xs group border border-black/5" 
                   style="background-color: ${course.color}; color: ${course.textColor}; min-height: ${cellState.rowspan * 40}px;">
                <button onclick="toggleEnroll('${course.id}')" class="absolute top-1 right-1 w-3.5 h-3.5 rounded-full bg-rose-500 text-white flex items-center justify-center text-[8px] opacity-80 hover:opacity-100 transition shadow-xs cursor-pointer" title="과목 취소">✕</button>
                <div class="font-bold text-[10px] sm:text-[11px] leading-tight break-keep px-1">${course.name}</div>
                <div class="text-[8px] sm:text-[9px] opacity-85 mt-0.5">${course.professor}</div>
              </div>
            `;
          }

          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }
    }

    function renderEnrolledBadges() {
      const container = document.getElementById('enrolled-badges');
      const countEl = document.getElementById('enrolled-count');
      container.innerHTML = '';
      countEl.innerText = enrolledCourses.length;

      enrolledCourses.forEach(c => {
        const badge = document.createElement('span');
        badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-teal-100 text-teal-800 border border-teal-200 shrink-0';
        badge.innerHTML = `
          ${c.name}
          <button onclick="toggleEnroll('${c.id}')" class="hover:text-rose-600 font-bold cursor-pointer">×</button>
        `;
        container.appendChild(badge);
      });
    }

    function addRandomCourses() {
      enrolledCourses = [];
      const shuffled = [...officialCourses].sort(() => 0.5 - Math.random());

      for (let course of shuffled) {
        if (!hasCollision(course)) {
          enrolledCourses.push(course);
          if (enrolledCourses.length >= 3) break;
        }
      }

      renderCatalog();
      renderTimetableGrid();
      renderEnrolledBadges();
      showToast('🎲 겹치지 않는 랜덤 3과목 완성이 적용되었습니다!');
    }

    function clearSchedule() {
      enrolledCourses = [];
      renderCatalog();
      renderTimetableGrid();
      renderEnrolledBadges();
      showToast('시간표가 초기화되었습니다.');
    }

    function exportImage() {
      const timetableArea = document.getElementById('timetable-area');
      showToast('📷 시간표 이미지를 생성 중입니다...');

      html2canvas(timetableArea, {
        scale: 2,
        backgroundColor: '#ffffff'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = '오타쿠대학교_수강시간표.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('✅ 시간표 이미지가 성공적으로 저장되었습니다!');
      }).catch(err => {
        console.error(err);
        showToast('❌ 이미지 저장에 실패하였습니다.');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = msg;
      
      toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
      }, 2500);
    }
  </script>
</body>
</html>
